# oinbox behind nginx instead of Caddy: the same five duties as deploy/routes.caddy.
# Tested as written (plain HTTP on 8080, in place of the dev stack's Caddy) with the sign-in, push
# and compose end-to-end suites. For production, add your `listen 443 ssl` and certificate lines
# and an HSTS header; nothing else changes.
#
# Assumes: Stalwart reachable as http://stalwart:8080, the unpacked oinbox release in /srv/oinbox/dist.
# Your own name and logo: edit /srv/oinbox/dist/branding.json (docs/operating.md, "Branding").
# Drive: edit /srv/oinbox/dist/drive.json and uncomment the /drive/ location below (docs/operating.md, "Drive").

server {
    listen 8080;
    root /srv/oinbox/dist;

    # The size of the largest attachment you allow (Stalwart's own default limit is 50 MB).
    client_max_body_size 50m;

    # 1. Stalwart's paths go to Stalwart...
    location ~ ^/(\.well-known/|jmap(/|$)|auth/|login(/|$)|device(/|$)|api/|admin(/|$)|logo$|healthz/) {
        proxy_pass http://stalwart:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The address nginx saw, not whatever list the client sent: Stalwart rate-limits and bans by it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 2. A "WWW-Authenticate: Basic" on a 401 makes browsers show their own login prompt.
        proxy_hide_header WWW-Authenticate;

        # 3. The push connection is a stream that stays open: no buffering, no compression, a long timeout.
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 1h;

        # Stalwart's own pages send no security headers.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ...except this one, which is the app's (an exact match wins over the pattern above).
    location = /auth/callback {
        try_files /index.html =404;
        include /etc/nginx/oinbox-headers.conf;
    }

    # 5. Compress the app's files (and only those: see `gzip off` above).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # File names under /assets/ change with their content, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/oinbox-headers.conf;
    }

    # Drive (optional): OpenCloud's two APIs under /drive/, prefix removed. Uncomment with drive.json's
    # "enabled": true. Nothing else of OpenCloud belongs on this origin: its web UI and public-link pages
    # serve what users upload. (This block follows deploy/routes.caddy but has not itself been run.)
    # location ~ ^/drive/(graph|dav/spaces)/ {
    #     rewrite ^/drive/(.*)$ /$1 break;
    #     proxy_pass http://opencloud:9200;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_hide_header WWW-Authenticate;
    #     proxy_hide_header Content-Security-Policy;
    #     proxy_hide_header X-Content-Type-Options;
    #     add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     proxy_request_buffering off;
    #     proxy_buffering off;
    #     client_max_body_size 0;
    # }
    # location /drive/ { return 404; }

    # 4. Everything else is the app: its files, or index.html for its routes. Never cache index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/oinbox-headers.conf;
    }
}
