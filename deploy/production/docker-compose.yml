# oinbox in production: Stalwart (mail, JMAP), OpenSearch (search) and oinbox (the app behind Caddy).
# Copy .env.example to .env, fill it in, then follow docs/operating.md.
name: oinbox

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.23
    restart: unless-stopped
    environment:
      # Base of every URL Stalwart hands out (JMAP session, OAuth discovery). Must be the public origin.
      STALWART_PUBLIC_URL: "https://${OINBOX_DOMAIN:?set OINBOX_DOMAIN}"
      STALWART_RECOVERY_ADMIN: "${STALWART_RECOVERY_ADMIN:?set STALWART_RECOVERY_ADMIN}"
    volumes:
      - ./config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
      # The certificate Caddy obtains, as cert-sync copies it: Stalwart uses it for SMTP and IMAP.
      - mail-certs:/certs:ro
    ports:
      - "25:25"     # SMTP from other mail servers
      - "465:465"   # submission over TLS, for mail apps
      - "993:993"   # IMAP over TLS, for mail apps
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/live"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s

  opensearch:
    # Stalwart's full-text search store (its ElasticSearch store type speaks to OpenSearch).
    image: opensearchproject/opensearch:2.19.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Reached only by Stalwart, inside this compose network: no port is published.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # The heap. Give it more on a server with many or large mailboxes.
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

  oinbox:
    image: ghcr.io/one-learning-community/oinbox:${OINBOX_VERSION:?set OINBOX_VERSION}
    restart: unless-stopped
    environment:
      OINBOX_DOMAIN: "${OINBOX_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
      # Optional branding (docs/operating.md, "Branding").
      OINBOX_BRAND_NAME: "${OINBOX_BRAND_NAME:-oinbox}"
      OINBOX_BRAND_LOGO: "${OINBOX_BRAND_LOGO:-}"
      OINBOX_DRIVE_UPSTREAM: "${OINBOX_DRIVE_UPSTREAM:-}"
      OINBOX_DRIVE_URL: "${OINBOX_DRIVE_URL:-}"
      OINBOX_DRIVE_LINK_OVER_MB: "${OINBOX_DRIVE_LINK_OVER_MB:-20}"
    ports:
      - "80:80"     # redirects to HTTPS; also answers the certificate authority's challenge
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - stalwart

  # Caddy keeps its certificates readable by root only, and Stalwart does not run as root. This copies
  # the certificate for OINBOX_DOMAIN to a volume Stalwart can read, now and after every renewal.
  # Stalwart picks a renewed copy up when told to: ./apply.sh --reload-tls (docs/operating.md).
  cert-sync:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      OINBOX_DOMAIN: "${OINBOX_DOMAIN}"
      # The directory Caddy uses for its certificate authority (Let's Encrypt, as the Caddyfile pins).
      CERT_ISSUER: "${CERT_ISSUER:-acme-v02.api.letsencrypt.org-directory}"
    volumes:
      - caddy-data:/data:ro
      - mail-certs:/certs
    command:
      - sh
      - -c
      - |
        src="/data/caddy/certificates/$$CERT_ISSUER/$$OINBOX_DOMAIN/$$OINBOX_DOMAIN"
        while true; do
          if [ -r "$$src.crt" ] && ! cmp -s "$$src.crt" /certs/tls.crt; then
            install -o 2000 -g 2000 -m 0400 "$$src.key" /certs/tls.key
            install -o 2000 -g 2000 -m 0444 "$$src.crt" /certs/tls.crt
            echo "cert-sync: copied the certificate for $$OINBOX_DOMAIN"
          fi
          # Often until the first certificate exists, then twice a day.
          if [ -r /certs/tls.crt ]; then sleep 43200; else sleep 10; fi
        done

  # Stalwart's command line, for apply.sh and for one-off commands:
  #   docker compose run --rm cli query Account
  cli:
    image: stalwartlabs/cli:1.0.12
    profiles: ["tools"]
    environment:
      STALWART_URL: "http://stalwart:8080"
      STALWART_USER: "${STALWART_ADMIN_USER:-admin}"
      STALWART_PASSWORD: "${STALWART_ADMIN_PASSWORD:-}"

volumes:
  stalwart-data:
  opensearch-data:
  caddy-data:
  caddy-config:
  mail-certs:
