# oinbox dev stack: Stalwart (JMAP/SMTP) + OpenSearch (FTS) + Caddy (SPA + same-origin proxy)
name: oinbox

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.23
    restart: unless-stopped
    environment:
      # Fixed dev admin (Stalwart's "recovery admin"; honoured in normal mode too). DEV ONLY.
      STALWART_RECOVERY_ADMIN: "admin:oinbox-admin-pass"
      # Base for every URL in /.well-known/jmap, oauth-authorization-server, openid-configuration.
      STALWART_PUBLIC_URL: "http://localhost:8080"
    volumes:
      # config.json only names the datastore; everything else is applied by seed.sh (stalwart/plan.ndjson)
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
    ports:
      - "2525:25"            # SMTP (MTA) for tests to inject mail
      - "1993:993"           # IMAPS (implicit TLS; Stalwart has no plaintext IMAP listener) for
                              # tests simulating another client mutating mail out-of-band
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  opensearch:
    # Stalwart's full-text search store (its ElasticSearch store type speaks to OpenSearch).
    image: opensearchproject/opensearch:2.19.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Reached only by Stalwart, inside this compose network: no port is published.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  caddy:
    # The app: SPA built from the repo root Dockerfile (pnpm build) and served by Caddy,
    # which also reverse-proxies Stalwart on the same origin.
    #   docker compose up -d --build        -> serves the dist baked into the image
    # For fast iteration against a local `pnpm build` (and for the e2e suite), add the
    # override that mounts ../dist instead:
    #   docker compose -f docker-compose.yml -f docker-compose.local-dist.yml up -d
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        OINBOX_COMMIT: "${OINBOX_COMMIT:-unknown}"
    image: oinbox-web:dev
    restart: unless-stopped
    environment:
      # Unset means the defaults: "oinbox", no logo, Stalwart at stalwart:8080.
      OINBOX_BRAND_NAME: "${OINBOX_BRAND_NAME:-oinbox}"
      OINBOX_BRAND_LOGO: "${OINBOX_BRAND_LOGO:-}"
    ports:
      - "8080:8080"
    volumes:
      # Live Caddyfile (the image has a copy baked in); `docker compose restart caddy` after edits.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
    depends_on:
      - stalwart

volumes:
  stalwart-data:
  opensearch-data:
