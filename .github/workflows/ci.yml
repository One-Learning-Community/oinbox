name: CI

# Every push, on any branch. The repo takes no pull requests from forks, so a push trigger
# alone covers pull requests too, without running each commit twice.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build # tsc -b, then vite build
        env:
          OINBOX_COMMIT: ${{ github.sha }}

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each job has its own stack, so the engines run side by side on one mailbox each.
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: phone, browser: webkit }
    env:
      OINBOX_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # the stack serves ./dist
      # Chromium always: the sign-in setup project runs on it.
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Start Stalwart, Meilisearch and Caddy
        working-directory: deploy
        # --build also proves the Dockerfile still builds the web image.
        run: docker compose -f docker-compose.yml -f docker-compose.local-dist.yml up -d --build --wait
      # Global setup seeds the stack. The phone project gets its tests with the phone audit.
      - run: pnpm exec playwright test --project=${{ matrix.project }} --pass-with-no-tests
      - name: Collect the stack's logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color > ../test-results/stack.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
