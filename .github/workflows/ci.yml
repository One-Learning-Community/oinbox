name: CI

# Every push to a branch. The repo takes no pull requests from forks, so a push trigger alone
# covers pull requests too, without running each commit twice. Not tags: a release tag points at
# a commit that has already been through this on its branch (the Release workflow runs for those).
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build # tsc -b, then vite build
        env:
          OINBOX_COMMIT: ${{ github.sha }}

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each job has its own stack, so the engines run side by side on one mailbox each.
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: phone, browser: webkit }
    env:
      OINBOX_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # the stack serves ./dist
      # Chromium always: the sign-in setup project runs on it.
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Start Stalwart, Meilisearch and Caddy
        working-directory: deploy
        # --build also proves the Dockerfile still builds the web image.
        run: docker compose -f docker-compose.yml -f docker-compose.local-dist.yml up -d --build --wait
      - run: pnpm exec playwright test --project=${{ matrix.project }} # global setup seeds the stack
      - name: Collect the stack's logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color > ../test-results/stack.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-template:
    name: Production template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OINBOX_COMMIT: ${{ github.sha }}
      # deploy/production/ci.override.yml: local CA, ports moved to 8443/8081/2526/4465/4993.
      ENV_FILE: ci.env
      COMPOSE_ARGS: -p oinbox-prod -f docker-compose.yml -f ci.override.yml
      PUBLIC_ORIGIN: https://localhost:8443
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check that the real production Caddyfile parses
        working-directory: deploy
        run: >
          docker run --rm -e OINBOX_DOMAIN=mail.example.com -e ACME_EMAIL=postmaster@example.com
          -v "$PWD/production/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/routes.caddy:/etc/caddy/routes.caddy:ro"
          caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Start the template (builds the app image)
        working-directory: deploy/production
        run: docker compose --env-file "$ENV_FILE" $COMPOSE_ARGS up -d --build --wait
      - name: Apply the settings and create a user
        working-directory: deploy/production
        run: |
          ./apply.sh
          ./create-test-user.sh
      - run: pnpm e2e:production
      - name: Collect the stack's logs
        if: failure()
        working-directory: deploy/production
        run: mkdir -p ../../test-results && docker compose --env-file "$ENV_FILE" $COMPOSE_ARGS logs --no-color > ../../test-results/production-stack.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: production-template-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

