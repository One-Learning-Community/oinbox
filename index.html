<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installing as an app: name, icons, shortcuts and email links. Caddy serves it with the operator's name (deploy/routes.caddy). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- An installed app's title bar; the theme code sets it to the page's background, light or dark. -->
    <meta name="theme-color" content="#f6f8fc" />
    <!-- interactive-widget: on Android the page is resized to what an on-screen keyboard leaves. iOS ignores it (src/ui/visible.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>oinbox</title>
  </head>
  <body>
    <!-- Shown while the script downloads; the app replaces it. No stylesheet exists yet at this point. -->
    <div id="root">
      <p style="margin: 20vh auto; text-align: center; font: 16px system-ui, sans-serif; opacity: 0.7">Loading…</p>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
